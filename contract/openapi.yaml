openapi: 3.0.3
info:
  title: Capacity API
  version: 0.1.0
  description: |
    Single source of truth for the HTTP contract between api/ (Go) and web/ (React).
    Generated from this file — never edit generated code by hand:
      - Go: types + strict server interface + embedded spec (cd api && go generate ./...)
      - Web: TanStack Query hooks, Zod schemas, MSW mocks (cd web && npm run gen)
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      responses:
        "200":
          description: Service is up and the database is seeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"

  /capacity:
    get:
      operationId: getCapacity
      tags: [capacity]
      summary: Allocated hours and capacity per person per week
      description: |
        The range is expanded to whole ISO weeks (Monday to Sunday): `from` moves back to its Monday,
        `to` moves forward to its Sunday. Allocation counts weekdays only (Monday to Friday).
        At most 13 weeks per request (a quarter); larger ranges are rejected with 400 range_too_large.
      parameters:
        - name: from
          in: query
          required: true
          description: First day of the range (inclusive), YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last day of the range (inclusive), YYYY-MM-DD. Must not be before `from`.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: One row per person, one value per week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityGrid"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /people/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Change a person's weekly capacity
      description: |
        Only capacity changes; allocations do not depend on weekly hours, so a client can update
        `weeklyHours` and every `capacityHours` for this person in every cached grid without refetching.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePerson"
      responses:
        "200":
          description: The updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable, e.g. validation_failed, range_too_large, not_found, internal.
          example: validation_failed
        message:
          type: string
          description: Human-readable, safe to show to a manager.

    Health:
      type: object
      required: [ok, people]
      properties:
        ok:
          type: boolean
        people:
          type: integer
          format: int64

    CapacityGrid:
      type: object
      required: [from, to, weeks, people]
      properties:
        from:
          type: string
          format: date
          description: Monday of the first week actually returned.
        to:
          type: string
          format: date
          description: Sunday of the last week actually returned.
        weeks:
          type: array
          description: Monday of each week, ascending. Column headers for the grid.
          items:
            type: string
            format: date
        people:
          type: array
          description: Every person, ordered by name then id, including people with no allocation.
          items:
            $ref: "#/components/schemas/PersonCapacity"

    PersonCapacity:
      type: object
      required: [id, name, weeklyHours, weeks]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        weeklyHours:
          type: number
          format: double
          description: The person's editable weekly capacity.
        weeks:
          type: array
          description: Exactly one entry per CapacityGrid.weeks item, in the same order.
          items:
            $ref: "#/components/schemas/PersonWeek"

    PersonWeek:
      type: object
      required: [weekStart, allocatedHours, capacityHours]
      properties:
        weekStart:
          type: string
          format: date
          description: Monday of the week.
        allocatedHours:
          type: number
          format: double
          description: Sum of hours_per_day over the weekdays (Mon-Fri) of this week covered by assignments.
        capacityHours:
          type: number
          format: double
          description: Capacity for this week. Equals weeklyHours today (there is no capacity history).

    Person:
      type: object
      required: [id, name, weeklyHours]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        weeklyHours:
          type: number
          format: double

    UpdatePerson:
      type: object
      required: [weeklyHours]
      additionalProperties: false
      properties:
        weeklyHours:
          type: number
          format: double
          minimum: 0
          maximum: 168
